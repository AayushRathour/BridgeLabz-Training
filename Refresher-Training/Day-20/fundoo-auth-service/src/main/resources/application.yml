server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/fundoo_auth_db
    username: root
    password: 7509

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

# JWT signing key, access-token lifetime (ms), and reset-token lifetime (ms).
jwt:
  secret: ChangeThisFundooAuthServiceSecretKeyBeforeProdUse1234567890
  expiration: 3600000
  reset-token-expiration-ms: 900000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

