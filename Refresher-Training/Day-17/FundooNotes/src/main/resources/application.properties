server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundoo_notes}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:7509}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ChangeThisFundooNotesSecretKeyBeforeProdUse1234567890}
jwt.expiration=3600000
jwt.reset-token-expiration-ms=900000

# --- JMS (embedded Artemis broker) - Reminder & Notification module ---
spring.artemis.mode=embedded
app.notifications.reminder-queue=note-reminders

# --- Redis - Token Caching for authorization performance ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# RabbitMQ

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:fundoo}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:fundoo123}

# RabbitMQ application names
app.rabbitmq.exchange=fundoo.exchange
app.rabbitmq.queue=note-created.queue
app.rabbitmq.routing-key=note.created

# --- Spring Batch / Excel Note Export ---
# Prevents the export job from running automatically when the application starts.
spring.batch.job.enabled=false
# Creates Spring Batch job-metadata tables in the configured MySQL database.
spring.batch.jdbc.initialize-schema=always
# Allows an environment variable to override the local Excel export directory.
app.exports.directory=${EXPORT_DIRECTORY:exports}
