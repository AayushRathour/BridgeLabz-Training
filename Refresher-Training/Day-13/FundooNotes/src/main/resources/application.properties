server.port=${SERVER_PORT:8080}

# MySQL connection. Set DB_URL, DB_USERNAME and DB_PASSWORD in the environment
# when your local MySQL credentials or host differ from these development defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fundoo_notes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keeps existing data between application restarts and updates the schema for this sample.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT config
jwt.secret=${JWT_SECRET:ChangeThisFundooNotesSecretKeyBeforeProdUse1234567890}
jwt.expiration=3600000
# reset-token validity: 15 minutes
jwt.reset-token-expiration-ms=900000
